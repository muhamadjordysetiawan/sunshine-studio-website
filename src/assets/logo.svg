<svg width="400" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gold gradient -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#D4AF37;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8860B;stop-opacity:1" />
    </linearGradient>
    <!-- Silver gradient -->
    <linearGradient id="silverGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E8E8E8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#C0C0C0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A8A8A8;stop-opacity:1" />
    </linearGradient>
    <!-- Gold glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Black background -->
  <rect width="400" height="200" fill="#000000"/>
  
  <!-- Silver curved lines -->
  <path d="M 50 30 Q 100 60, 150 40 T 250 50 T 350 35" stroke="url(#silverGradient)" stroke-width="2" fill="none" opacity="0.8"/>
  <path d="M 30 80 Q 120 100, 200 85 T 370 90" stroke="url(#silverGradient)" stroke-width="2" fill="none" opacity="0.8"/>
  <path d="M 60 130 Q 150 150, 240 135 T 360 140" stroke="url(#silverGradient)" stroke-width="2" fill="none" opacity="0.8"/>
  <path d="M 40 160 Q 130 180, 220 165 T 340 170" stroke="url(#silverGradient)" stroke-width="2" fill="none" opacity="0.8"/>
  
  <!-- Gold starburst in upper left -->
  <g transform="translate(50, 30)">
    <path d="M 0 -15 L 3 -3 L 15 -3 L 3 3 L 0 15 L -3 3 L -15 -3 L -3 -3 Z" fill="url(#goldGradient)" filter="url(#glow)"/>
  </g>
  
  <!-- Japanese text エピゴネン -->
  <text x="280" y="35" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="url(#goldGradient)" filter="url(#glow)">エピゴネン</text>
  
  <!-- SUNSHINE text -->
  <text x="200" y="110" font-family="Arial, sans-serif" font-size="48" font-weight="900" fill="url(#goldGradient)" text-anchor="middle" filter="url(#glow)" letter-spacing="4">SUNSHINE</text>
  
  <!-- STUDIOS text -->
  <text x="200" y="150" font-family="Arial, sans-serif" font-size="36" font-weight="900" fill="url(#goldGradient)" text-anchor="middle" filter="url(#glow)" letter-spacing="3">STUDIOS</text>
</svg>

